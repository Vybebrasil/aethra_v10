    <style>
        .integration-test-report {
            position: fixed;
            z-index: 100000;
            top: 16px;
            right: 16px;
            width: min(420px, calc(100vw - 32px));
            max-height: calc(100vh - 32px);
            overflow: auto;
            padding: 18px;
            border: 1px solid #4f5d73;
            border-radius: 14px;
            background: rgba(13, 18, 27, 0.96);
            color: #edf2f7;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
            font: 14px/1.45 system-ui, sans-serif;
        }

        .integration-test-report header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .integration-test-report h1 {
            margin: 0;
            font-size: 18px;
        }

        .integration-test-report [data-test-state] {
            padding: 4px 8px;
            border-radius: 999px;
            background: #6b7280;
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        .integration-test-report[data-test-status="passed"] [data-test-state] {
            background: #15803d;
        }

        .integration-test-report[data-test-status="failed"] [data-test-state] {
            background: #b91c1c;
        }

        .integration-test-report p {
            margin: 10px 0 0;
            color: #cbd5e1;
        }

        .integration-test-report ul {
            display: grid;
            gap: 6px;
            margin: 14px 0 0;
            padding: 0;
            list-style: none;
        }

        .integration-test-report li {
            display: grid;
            gap: 2px;
            padding: 8px 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
        }

        .integration-test-report li[data-passed="false"] strong {
            color: #fca5a5;
        }

        .integration-test-report li[data-passed="true"] strong {
            color: #86efac;
        }

        .integration-test-report li span {
            color: #94a3b8;
            font-size: 12px;
        }
    </style>
    <script>
        window.__AETHRA_QA = { errors: [], rejections: [], resourceErrors: [] };
        const syncQaDiagnostics = () => {
            document.documentElement.dataset.qaErrors = String(window.__AETHRA_QA.errors.length);
            document.documentElement.dataset.qaRejections = String(window.__AETHRA_QA.rejections.length);
            document.documentElement.dataset.qaResourceErrors = String(window.__AETHRA_QA.resourceErrors.length);
            document.documentElement.dataset.qaDetails = JSON.stringify(window.__AETHRA_QA);
        };
        window.addEventListener("error", (event) => {
            if (event.target && event.target !== window) {
                window.__AETHRA_QA.resourceErrors.push(
                    event.target.currentSrc || event.target.src || event.target.href || event.target.tagName
                );
                syncQaDiagnostics();
                return;
            }
            window.__AETHRA_QA.errors.push(event.message || String(event.error || "Erro desconhecido"));
            syncQaDiagnostics();
        }, true);
        window.addEventListener("unhandledrejection", (event) => {
            window.__AETHRA_QA.rejections.push(event.reason?.message || String(event.reason || "Rejeição desconhecida"));
            syncQaDiagnostics();
        });
        syncQaDiagnostics();
        window.AETHRA_SAVE_KEY = "aethra_integration_test_v68";
        window.AETHRA_INTEGRATION_TEST = true;
        // A suíte testa o fluxo clássico e liga a UI 3.0 onde precisa.
        window.AETHRA_INTERFACE_DEFAULT = "classic";
        window.AETHRA_SETTINGS_KEY = "aethra.integration-test.settings";

        try {
            window.localStorage.removeItem(window.AETHRA_SAVE_KEY);
            window.localStorage.removeItem(window.AETHRA_SETTINGS_KEY);
            window.localStorage.removeItem(`${window.AETHRA_SETTINGS_KEY}.battleMode`);
        } catch (error) {
            console.warn("Não foi possível limpar o estado isolado de teste.", error);
        }
    </script>
